[bar.default]
center = [ "temp", "ram", "sysmon" ]
end = [
    "media",
    "spacer_1",
    "widget",
    "notifications",
    "volume",
    "brightness",
    "bluetooth",
    "network",
    "battery",
    "spacer_1",
    "clock"
]
margin_ends = 0
margin_opposite_edge = 5
start = [ "launcher", "spacer_1", "workspaces", "spacer_1", "tray" ]

[widget.clock]
format = "{:%a %D %H:%M:%S}"

[widget.media]
art_size = 20
hide_when_no_media = true
max_length = 250
title_scroll = "on_hover"

    [widget.media.actions]
    back = "none"
    forward = "none"
    scroll_down = "none"
    scroll_up = "none"

[widget.network]
show_label = false

[widget.ram]
custom_image = ""
visualization = "none"

[widget.spacer_1]
length = 18
type = "spacer"

[widget.sysmon]
path = "~"
stat = "disk_free"
visualization = "none"

[widget.temp]
display = "text"
glyph = "temperature"
visualization = "none"

[widget.widget]
type = "yuuto/arch-updater:widget"

[keybinds]
down = [ "Down", "Ctrl+n", "Ctrl+j" ]
left = [ "Left", "Ctrl+h" ]
right = [ "Right", "Ctrl+l" ]
up = [ "Up", "Ctrl+p", "Ctrl+k" ]

[shell]
clipboard_enabled = false
panel_anchor_bar = "default"
password_style = "random"
screen_time_enabled = true

    [shell.launcher]
    fetch_exchange_rates = false

    [shell.mpris]
    blacklist = [ "Mozilla firefox" ]

    [shell.panel]
    launcher_placement = "attached"
    open_near_click_control_center = true

    [shell.screen_corners]
    enabled = true

[osd]
offset_x = 8
orientation = "vertical"
position_vertical = "top_left"

[notification]
offset_x = 8

[wallpaper_panel]
flatten = true
